<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>yt auth complete</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 40px; }
        .box { background: #1e1e1e; padding: 25px; border-radius: 12px; max-width: 480px; margin: auto; }
        .btn { display: inline-block; background: #2ea043; color: #fff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>authorization code ready</h2>
        <p>click the button below to copy code and return to telegram:</p>
        <a id="tg-btn" class="btn" href="#">return to bot</a>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        if (code) {
            navigator.clipboard.writeText(code);
            // deep link opening bot directly
            document.getElementById('tg-btn').href = `https://t.me/@beat2vidbot?start=code_${encodeURIComponent(code)}`;
            document.getElementById('tg-btn').innerText = "open telegram (code copied)";
        }
    </script>
</body>
</html>
