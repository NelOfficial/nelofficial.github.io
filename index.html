<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>beat2vid yt oauth</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --accent: #238636;
            --accent-hover: #2ea043;
            --code-bg: #0b0e14;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
        body { background-color: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .container { background-color: var(--card); border: 1px solid var(--border); border-radius: 12px; max-width: 520px; width: 100%; padding: 32px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1 { font-size: 20px; font-weight: 600; margin-bottom: 12px; color: #f0f6fc; }
        p { font-size: 14px; line-height: 1.5; margin-bottom: 20px; color: #8b949e; }
        .code-box { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 13px; word-break: break-all; color: #79c0ff; margin-bottom: 20px; max-height: 120px; overflow-y: auto; }
        .btn { display: block; width: 100%; padding: 12px; background-color: var(--accent); color: #fff; text-align: center; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; transition: background 0.2s; }
        .btn:hover { background-color: var(--accent-hover); }
        .status { margin-top: 14px; font-size: 12px; text-align: center; color: #3fb950; min-height: 16px; }
        .error { color: #f85149; }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="title">beat2vid youtube auth</h1>
        <p id="desc">data processing google iam...</p>
        <div class="code-box" id="code-display">code waiting...</div>
        <button class="btn" id="action-btn" onclick="copyAndNotify()">copy code</button>
        <div class="status" id="status-msg"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const error = params.get('error');

        const codeDisplay = document.getElementById('code-display');
        const statusMsg = document.getElementById('status-msg');
        const actionBtn = document.getElementById('action-btn');
        const desc = document.getElementById('desc');

        if (code) {
            codeDisplay.textContent = code;
            desc.textContent = "send this code to bot in telegram:";
            navigator.clipboard.writeText(code).then(() => {
                statusMsg.textContent = "code copied";
            }).catch(() => {
                statusMsg.textContent = "click on button below for manual copying";
            });
        } else if (error) {
            codeDisplay.textContent = error;
            codeDisplay.classList.add('error');
            desc.textContent = "auth error google iam:";
            actionBtn.style.display = "none";
        } else {
            codeDisplay.textContent = "code param is missing in url query";
            actionBtn.style.display = "none";
        }

        function copyAndNotify() {
            if (!code) return;
            navigator.clipboard.writeText(code).then(() => {
                statusMsg.textContent = "copied";
            });
        }
    </script>
</body>
</html>
